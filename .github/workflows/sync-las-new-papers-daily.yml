name: Daily LAS New Papers Sync

on:
  schedule:
    # 09:00 UTC daily -- las-new-papers' own pipeline starts at 07:23 UTC and
    # takes up to ~30 minutes on a backfill day, so this leaves it well over an
    # hour to commit data/feed.xml and the day files before we read them.
    - cron: '0 9 * * *'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # 20, not 18. The map build below runs `npm ci`, and this project's
          # dependencies do not install on 18.
          node-version: '20'
          cache: npm

      - name: Sync papers feed
        run: node scripts/sync-las-new-papers.mjs

      # umap-js is a devDependency. The sync above needs no install; the
      # projection below does. A failure in either of the next two steps leaves
      # data/las-new-papers.json as the sync wrote it.
      - name: Install dependencies
        run: npm ci

      - name: Rebuild the paper map
        run: node scripts/build-papers-map.mjs

      - name: Check for changes
        id: check
        run: |
          if [ -n "$(git status --porcelain data/las-new-papers.json data/las-new-papers-map.json)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "las-new-papers-sync[bot]"
          git config user.email "bot@largeagentsystems.org"
          git add data/las-new-papers.json data/las-new-papers-map.json
          DAYS=$(jq 'length' data/las-new-papers.json)
          PAPERS=$(jq '[.[].papers | length] | add // 0' data/las-new-papers.json)
          PLOTTED=$(jq '.n' data/las-new-papers-map.json)
          git commit -m "chore: sync papers from las-new-papers ($DAYS days, $PAPERS papers, $PLOTTED mapped) [skip ci]"
          git push
